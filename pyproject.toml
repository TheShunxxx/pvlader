[project]
name = "pvlader"
version = "0.1.0"
description = "PV-Überschussladen (evcc-Ersatz) als Home-Assistant-Custom-Integration"
requires-python = ">=3.12"
dependencies = ["pymodbus>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-homeassistant-custom-component"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # macht custom_components.pvlader für die HA-Tests importierbar
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
